services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:////app/data/stroke_app.db
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - app_data:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json, urllib.request;
          data = json.load(urllib.request.urlopen(
          "http://localhost:8000/api/v1/health"));
          raise SystemExit(0 if data.get("status") == "ok" else 1)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api/v1
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.15.2
    command:
      - mlflow
      - server
      - --backend-store-uri
      - sqlite:////mlflow-data/mlflow.db
      - --artifacts-destination
      - /mlflow-data/mlartifacts
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --workers
      - "1"
      - --allowed-hosts
      - mlflow:5000,localhost:5001,127.0.0.1:5001
    ports:
      - "5001:5000"
    volumes:
      - mlflow_data:/mlflow-data

volumes:
  app_data:
  mlflow_data:
